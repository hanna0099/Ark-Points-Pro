<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Ark Points Pro</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: "Segoe UI", "Malgun Gothic", -apple-system, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .wrap {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }
    .title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .title .accent { color: #6c8cff; }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6c8cff;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 14px;
      color: #9aa0aa;
      min-height: 18px;
    }
    .hint {
      position: absolute;
      bottom: 16px;
      font-size: 11px;
      color: #555b66;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">Ark <span class="accent">Points</span> Pro</div>
    <div class="spinner"></div>
    <div class="status" id="status">시작하는 중…</div>
  </div>
  <div class="hint">잠시만 기다려 주세요. 처음 실행은 몇 초 더 걸릴 수 있어요.</div>
</body>
</html>
